# OppaiOracle V2 Phase 1 — adopted recipe: todos/v2-plan.md sections 3–8.
# Prepare after every subset has arrived:
#   python tools/prepare_v2_dataset.py --config configs/unified_config.yaml
# Then launch with Start_AI_Training.ps1. Preparation does not start training.
project_name: "anime-image-tagger"
experiment_name: "v2_phase1_vit"
output_root: "./experiments"
log_level: "INFO"
log_format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
max_memory_gb: 120.0
max_gpu_memory_gb: null
vocab_path: "./vocabulary/v2/vocabulary.json"
log_dir: "./logs/v2_phase1"
default_output_dir: "./outputs"

model:
    architecture_type: "vit"
    hidden_size: 896
    num_hidden_layers: 18
    num_attention_heads: 14
    intermediate_size: 2320
    image_size: 320  # Synced from data.image_size.
    patch_size: 16
    num_channels: 3
    hidden_dropout_prob: 0.0
    pos_dropout: 0.0
    attention_dropout: 0.0
    drop_path_rate: 0.20
    qk_norm: true
    layer_scale_init: 0.1
    initializer_range: 0.02
    layer_norm_eps: 1.0e-6
    use_flex_attention: true
    attention_bias: true
    flex_block_size: 128
    token_ignore_threshold: 0.9
    num_labels: 0
    num_groups: 20
    tags_per_group: 10000
    gradient_checkpointing: true
    checkpoint_every_n_layers: 4

data:
  # All top-level subsets below this root are included recursively.
  # Discovery ignores environments, updater state JSONs and unpaired JSONs.
  storage_locations:
    - path: "E:/Dataset"
      priority: 0
      type: "local"
      enabled: true
  preparation_manifest: "./logs/v2_phase1/dataset_manifest.json"
  vocab_dir: "./vocabulary/v2"
  output_dir: "./outputs"
  image_size: 320
  color_order: "RGB"
  normalize_mean: [0.5, 0.5, 0.5]
  normalize_std: [0.5, 0.5, 0.5]
  pad_color: [114, 114, 114]
  # Provisional microbatch; profile on the target GPU before the long run.
  # 64 x 16 accumulation = 1024; sqrt scaling gives stable LR 5.4e-4.
  batch_size: 64
  num_workers: 6
  pin_memory: true
  prefetch_factor: 3
  persistent_workers: true
  drop_last: false
  worker_log_level: WARNING
  vocab_min_frequency: 500
  max_val_samples: 30000
  preload_files: 0
  metadata_cache_enabled: true
  metadata_cache_workers: 20
  force_rebuild_metadata_cache: false
  metadata_cache_staleness_check_samples: 100
  split_cache_version: "3.0"
  metadata_cache_version: "3.0"
  metadata_cache_use_dynamic_sampling: true
  metadata_cache_use_stratified_sampling: true
  cache_count_tolerance_percent: 0.1
  cache_count_tolerance_min: 100
  # Adopted P1 augmentation; pending review proposals are not enabled.
  random_flip_prob: 0.5
  color_jitter_enabled: true
  color_jitter_brightness: 0.30
  color_jitter_brightness_p: 0.5
  color_jitter_contrast: 0.20
  color_jitter_contrast_p: 0.5
  color_jitter_saturation: 0.08
  color_jitter_saturation_p: 0.5
  random_erasing_enabled: false
  random_erasing_p: 0.35
  random_erasing_scale_min: 0.007
  random_erasing_scale_max: 0.03
  random_erasing_ratio_min: 0.3
  random_erasing_ratio_max: 2.0
  random_rotation_enabled: true
  random_rotation_p: 0.50
  random_rotation_min_degrees: 2.0
  random_rotation_max_degrees: 8.0
  gaussian_blur_enabled: true
  gaussian_blur_p: 0.30
  gaussian_blur_kernel_size: 3
  gaussian_blur_sigma_min: 0.1
  gaussian_blur_sigma_max: 1.5

training:
    memory_format: "contiguous"
    phase: 1
    num_epochs: 60  # User ceiling, INCLUDING terminal cooldown.
    learning_rate: 2.7e-4
    lr_scaling_mode: "sqrt"
    lr_base_batch_size: 256
    weight_decay: 0.05
    gradient_accumulation_steps: 16
    optimizer: "adamw8bit"
    fp32_head_optimizer: true
    adam_beta1: 0.9
    adam_beta2: 0.999
    adan_beta3: 0.99
    adam_epsilon: 1.0e-7
    scheduler: "wsd"
    warmup_steps: 10000
    warmup_epochs: 0  # Explicit update count above takes precedence.
    wsd_cooldown_fraction: 0.15
    # Review stable-phase jitter over the first ~10 evaluations before arming.
    # Budget-triggered cooldown remains automatic even with this gate disabled.
    wsd_plateau_enabled: false
    num_cycles: 1
    cycle_decay: 0.9
    lr_end: 0.0

    # Mixed precision
    # Enabled by default to reduce VRAM usage and improve performance.
    # bfloat16 is preferred for its numerical stability and range, similar to float32.
    use_amp: true
    amp_dtype: bfloat16           # one of: bfloat16, float16
    enable_anomaly_detection: false  # set true for debugging only

    # Gradient clipping
    gradient_clipping:
      enabled: true
      max_norm: 1.0

    # Checkpointing
    save_steps: 10000
    save_total_limit: 3
    save_best_only: false
    # Resume behavior (choose per run/goal):
    #   "none" | "latest" | "best" | "/path/to/checkpoint.pt"
    # Tip: use "latest" while iterating, "best" for polishing/finetune,
    # or point to an exact checkpoint to branch experiments safely.
    resume_from: "latest"  # Fresh V2 directory; subsequent starts safely resume V2.
    # Legacy cosine resume policy. WSD always rejects geometry changes so
    # warmup/cooldown progress cannot be silently rewritten after a pause.
    on_lr_schedule_change: "error"

    eval_steps: 0  # Validate every completed epoch and at terminal cooldown.
    logging_steps: 500
    # Resume-aware reseeding: avoid replaying the same early-epoch order after resume
    resume_reseed: true
    # Vocab-resume safety: refuse to resume unless the current vocabulary's SHA256
    # can be verified against the checkpoint's embedded SHA (a mismatch silently
    # scrambles every label index). Set true ONLY to load a legacy checkpoint that
    # predates embedded vocab SHAs.
    allow_unverified_vocab_resume: false

    # Loss configuration
    tag_loss:
      alpha: 1.0            # 1.0 = disabled (pure ASL, no alpha weighting: pos_loss + neg_loss)
      # V2 fixed loss, verified after checkpoint loading.
      gamma_neg: 7.0
      # Retired override: must remain null.
      gamma_neg_override: null
      gamma_pos: 0.0        # ASL paper optimal: no focal suppression on positives (preserves scarce positive gradient)
      label_smoothing: 0.0   # Disabled — label smoothing + focal loss corrupts focal weights on sparse multi-label targets
      clip: 0.05
      detach_focal_weight: true
      class_weight_strategy: null  # Removed: redundant with ASL gamma_neg (double-correction risk; ASL paper Table 2: pure ASL > FL+linear weighting)
      class_weight_clip_min: 0.05            # No-op when class_weight_strategy is null
      class_weight_clip_max: 5.0             # No-op when class_weight_strategy is null
      class_weight_beta: 0.9999              # No-op when class_weight_strategy is null

    # Fixed-loss policy: retired schedule has no mutation authority.
    asl_schedule:
      enabled: false

    # Always-on telemetry + gates (todos/v2-plan.md Appendix A) computed on
    # logits[:, 2:] (PAD/UNK excluded), fp32-upcast, sampled only on
    # optimizer-update boundaries. Includes the §4 shadow controller
    # (logging-only — it NEVER sets gamma; the loss remains fixed).
    asl_telemetry:
      enabled: true
      interval_updates: 100      # EMA sample cadence (optimizer updates)
      log_every_updates: 500     # TensorBoard + checkpoint-state sync cadence
      ema_beta: 0.98
      topk_hard: 10              # Δp_hard = mean(p_pos) − mean(top-K non-GT)
      num_deciles: 10            # tag-frequency deciles for the EPR tripwire
      hist_min: 0.05             # non-GT score histogram range…
      hist_max: 0.95
      hist_bins: 18
      watch_band_low: 0.2        # …with the §2 clip-cost watch band [0.2, 0.5]
      watch_band_high: 0.5
      epr_alarm_rel_drop: 0.05   # >5% relative EPR drop in any decile…
      epr_alarm_window_epochs: 2 # …within 2 epochs of a γ step → step back up
      exclude_rating_tags: true  # §5 hygiene: rating tags inflate mean(p_pos)
      sibling_groups_path: "./configs/confusable_groups.json"  # sibling-gap groups
      shadow_controller_enabled: true
      shadow_lambda: 0.05
      shadow_delta_p_target: 0.2 # paper Table 3 best-tested target

    # Ratings are now encoded as regular tags (rating:general, rating:sensitive, etc.)
    # and trained with the same tag loss. No separate rating_loss section needed.
    # Hardware
    device: "cuda"
    # torch.compile() Optimization (PyTorch 2.0+)
    # Provides 15-35% speedup through graph optimization and kernel fusion
    # Especially effective for transformer models with attention mechanisms
    use_compile: true
    compile_mode: "max-autotune-no-cudagraphs"  # Triton autotuning without CUDA graph VRAM overhead
    compile_fullgraph: false  # Allow graph breaks for dynamic shapes (padding masks)
    compile_dynamic: true  # Enabled - prevents recompilation when batch size varies (e.g., corrupt images)
    # First compilation takes 2-5 minutes but is negligible over 60 epochs

    # Tracking
    use_tensorboard: true
    # Training stability (from runtime.yaml)
    seed: 42
    deterministic: false
    benchmark: true

    # Frozen-list binned macro-mAP drives checkpoint selection and plateau advice.
    # Oracle F1 and exact mAP remain reporting-only diagnostics.
    selection_metric: val_mAP

    # --- Best-checkpoint selection (NOT the stop rule) ---
    # These two now govern only whether an epoch overwrites best_model.pt.
    # Keep the threshold near zero so the argmax checkpoint is always retained;
    # the noise-floor question belongs to the stop rule, not to which weights we
    # keep. `early_stopping_patience` is no longer read for stopping.
    early_stopping_patience: 4
    early_stopping_threshold: 0.0000005
    # Epochs excluded from stop decisions entirely (initial instability).
    early_stopping_burn_in_epochs: 2
    # One of: median, mean, last, max. This is now actually honored — the old
    # code did `max(baseline, max(burn_in_values))`, which is always the max, so
    # every strategy silently behaved as `max` and the post-burn-in bar was the
    # burn-in high-water mark. A lucky spike then set a bar the real curve needed
    # many epochs to clear.
    early_stopping_burn_in_strategy: median

    # --- Stop system (stop_conditions.py) ---
    # All rules are pure functions of training_state.eval_history, so they are
    # unchanged by a soft stop / resume. See stop_conditions.py's module docstring
    # for what each rule replaces.
    #
    # advise = trip is logged + recorded, run continues to the epoch budget.
    # halt   = trip ends the run.  off = evaluate and log only.
    # 'advise' is the default deliberately: in V1-P2 the one mechanical red flag
    # was overridden by the operator and the operator was right (mAP kept rising
    # for the rest of the run). Every band below is V1-calibrated and must be
    # re-derived on V2's own val curve before it is trusted to end a run.
    early_stopping_mode: advise
    # Plateau: required gain of best(last `window` validated epochs) over
    # best(previous `window`), confirmed on `confirm` consecutive evaluations.
    # 3e-3 is the MEASURED resolution floor of this val instrument (see the
    # ap_thresholds note below and todos/v2-plan.md §8.3): binning bias -0.0031,
    # 30K sampling CI ±0.0027. It STRADDLES a single epoch's real gain — V1-P2's
    # per-epoch gains were +0.0041 +0.0045 +0.0015 +0.0031 +0.0022, two of five
    # below it — which is why the test is window-over-window and not per-epoch.
    # Replay check (test_stop_conditions.py): V1-P2's E0–E5 mAP
    # (.6591 .6631 .6676 .6691 .6722 .6744) gives a window gain of +0.0067, so
    # this rule would NOT have stopped that run. Canary #1's ≥1.01×/epoch band
    # flagged it from E2 onward.
    early_stopping_min_delta: 0.003
    early_stopping_window: 3
    early_stopping_confirm: 2
    # Explicit floor on validated epochs before any rule may fire. The old code
    # had no such key; it inherited a floor from `lr < 0.5 * scheduler.max_lr`,
    # which on num_cycles=1 is false until the midpoint of the anneal — so the
    # auto-stop could not fire before ~epoch 8.5 of P2's 15 and, with patience=4,
    # the earliest possible stop was ~epoch 13. State the floor, don't inherit it.
    early_stopping_min_epochs: 4
    # Peak-and-decline: metric sitting this far below its all-time best for this
    # many consecutive validated epochs. 2× min_delta so a decline must clear the
    # noise floor twice over.
    early_stopping_regression_delta: 0.006
    early_stopping_regression_confirm: 2
    # Overfitting (canary #6): consecutive validated epochs with val_loss rising
    # while train_loss falls. This is the only rule here that reads directly on
    # the thing V1 was trying to avoid — and it never fired at either V1 stop
    # (val_loss fell monotonically E0→E5 alongside train_loss).
    early_stopping_overfit_confirm: 3
    # Per-phase plateau geometry, keyed like asl_schedule. The plateau rule cannot
    # confirm before burn_in + 2*window + confirm - 1 validated epochs, so a
    # ~55-epoch from-scratch phase and a 3-4 epoch detail phase cannot share one
    # setting: at window=3/confirm=2 the latter can NEVER confirm — the same
    # silent-no-op class as the LR gate this system replaced. Values follow
    # todos/v2-plan.md §7's phase table. Omitted keys inherit the values above;
    # `null` means inherit.
    early_stopping_phases:
      phase1: { window: 3, confirm: 2 }   # ~55 epochs: full geometry is affordable
      phase2: { window: 2, confirm: 1 }   # ~12 epochs: window=3/confirm=2 leaves only ~4 of coverage
      phase3: { mode: "off" }             # 3-4 epochs, "run it, don't gate it" (§7)

# Inference Configuration (from inference_config.yaml)
inference:
  model_path: "./checkpoints/best_model.pt"
  precision: "bf16"  # Set precision to bf16 for inference
  # Prediction
  # Micro P=R break-even measured on THIS model: epoch 7 / step 85517 (last.pt),
  # 296,056 validation samples, 19,292 tags -> threshold 0.792672, P=R=0.6987.
  # (A 30K-sample run of the same checkpoint independently gives 0.792695.)
  # The previous 0.2653 was borrowed from competing v2.0 models and never
  # measured here; at that value the model emitted ~4,158 tags/image against
  # ~36 true tags. F1-optimal is slightly higher at 0.805 (P=0.7300, R=0.6732) —
  # 0.7927 is the balanced-precision/recall point, choose 0.805 if you prefer
  # precision. threshold_calibration.default_threshold below MUST match this.
  prediction_threshold: 0.7927
  top_k: null

  # Performance
  max_batch_size: 32
  
  # Output
  output_format: "json"
  
  # Caching
  enable_cache: true
  cache_ttl_seconds: 3600
  max_cache_size: 1000

# Threshold Calibration (post-training, inference-time)
threshold_calibration:
  enabled: false
  mode: "per_bucket"  # "per_tag" | "per_bucket"
  # Must equal inference.prediction_threshold (enforced in FullConfig.validate).
  default_threshold: 0.7927
  save_path: "./thresholds.json"

# Export Configuration (from export_config.yaml)
export:
  export_format: "onnx"
  opset_version: 21
  export_params: true
  do_constant_folding: true
  dynamic_batch_size: true
  max_batch_size: 128
  optimize: true
  quantize: false
  quantization_type: "dynamic"
  validate_export: true
  tolerance_rtol: 1.0e-3
  tolerance_atol: 1.0e-5
  num_validation_samples: 10
  add_metadata: true
  model_description: "Anime Image Tagger Model"
  model_author: "AnimeTaggers"
  model_version: "1.0.0"
  # FILE path of the .onnx to write (NOT a directory — sibling artifacts such as
  # selected_tags.csv are written to its parent). The old value "./exported_model"
  # collided with the directory of the same name, so every save failed.
  output_path: "./exported_model/model.onnx"
  # 16-bit by default (model is trained in bf16; fp16 is the well-tested ORT path).
  # Choices: 'full' (fp32), 'fp16', 'quantized'. List multiple to produce multiple files.
  export_variants: ['fp16']

# ──────────────────────────────────────────────────────────────────────────────
# Validation (migrated from configs/validation_config.yaml)
# Centralized knobs for validation dataloader & preprocessing.
# These are read by validation_loop.py at runtime.
validation:
  # Sample cap for the STANDALONE validation_loop.py runner only. The in-training
  # validation pass is capped by data.max_val_samples (which trims the split
  # before the Arrow cache is built), so this key never affects train_direct.py.
  max_samples: 30000
  # Frequency-bin edges for bucketed validation metrics (val_bucketed/* in
  # TensorBoard and validation_loop's by-frequency analysis). Uncomment to
  # override; default shown below (.inf = open-ended top bucket).
  # frequency_bins: [300, 500, 1000, 5000, 10000, .inf]
  # Uniform threshold count for the binned mAP metric. DO NOT RAISE without
  # measuring: torchmetrics allocates a (chunk x num_labels x ap_thresholds)
  # int64 intermediate per update, so the transient peak dominates.
  # Historical unchunked RTX 5090 @ B=48, 19.3K labels — 200: 9.3 GB peak;
  # 500: 23.3 GB peak; 2000: 93 GB peak and ~103 min per validation pass.
  # Cost of 200 is a mAP bias of ~-0.0031 vs the exact metric, near-uniform
  # across support buckets — treat val_mAP differences below ~0.003 as noise.
  ap_thresholds: 200
  # Slice only metric updates, preserving model batch size and the 200-bin score.
  # Eight rows: 1.18 GiB additional peak vs 8.46 GiB for 48, identical counts.
  ap_update_chunk_size: 8
  # Freeze the macro-average tag list at the first validated epoch of the phase.
  # The per-epoch `val_pos_counts > 0` denominator drifts (the per-batch error
  # filter drops different samples on different epochs), and the stop rules
  # compare mAP across epochs at a 3e-3 scale, so drift there is not harmless.
  # The frozen index list is persisted in the checkpoint, so it survives a soft
  # stop and stays identical for the whole phase.
  freeze_macro_tag_list: true
  # Advisory missing-positive / memorization fingerprints, computed streaming per
  # val batch (no full-matrix retention, so they stay affordable at the full
  # ~276K val split). Logged to TensorBoard as val_fingerprint/* and flagged
  # after 2 consecutive moves in the problem direction. NEVER a stop cause —
  # see todos/v2-monitoring.md "Missing-positive bias diagnostics".
  log_memorization_fingerprints: true
  fingerprint_topk: 10
  fingerprint_rank_window: [11, 50]
  dataloader:
    batch_size: 48  # Model inference batch; AP updates use ap_update_chunk_size rows.
    num_workers: 6  # Increased for smoother validation throughput
    pin_memory: true  # Enables async DMA transfer for faster CPU-GPU transfer
    prefetch_factor: 3  # 6 workers × 3 batches × 48 = 864 samples prefetched
    persistent_workers: true  # NOTE: auto-forced to false when num_workers == 0
  preprocessing:
    # Uses data.normalize_mean/std by default; keep in sync with
    # training/inference unless intentionally different.
    image_size: 320  # Auto-synced from data.image_size at startup
    patch_size: 16   # Auto-synced from model.patch_size at startup

# ──────────────────────────────────────────────────────────────────────────────
# Monitoring & Alerts
# Configures the monitoring system, including alerts for training events.
monitor:
  log_level: "INFO"
  log_to_file: true
  log_to_console: true

  # System resource tracking
  track_system_metrics: true
  system_metrics_interval: 30.0  # Background collection interval (seconds)
  system_metrics_log_interval_steps: 3000  # How often to log to TensorBoard (steps)
  track_gpu_metrics: true
  track_disk_io: true
  # Visualization
  tensorboard_dir: "./tensorboard"

  # Alerts
  enable_alerts: true
  alert_on_gpu_memory_threshold: 0.9
  alert_on_cpu_memory_threshold: 0.9
  alert_on_disk_space_threshold: 0.95
  alert_on_training_stuck_minutes: 30
  alert_on_loss_explosion: 10.0
  alert_on_nan_loss: true
  # --------------------------------------------------------------------
  # --- WEBHOOK REVIEW POINT ---
  # The actual webhook URL is stored separately in sensitive_config.py.
  # Replace ALERT_WEBHOOK_URL in that file with your private Discord webhook.
  # alert_webhook_url: "your_webhook_url_here"
  # --------------------------------------------------------------------

  tb_image_logging:
    max_samples: 50         # Number of images to grade per logging interval
    topk: 100               # how many tags per sample in Text tab
    log_native_resolution: true  # keep images crisp in TB
    dpi_for_figures: 220          # only used if you later add composite figures
    image_log_steps: 10000  # Log training images to TensorBoard every N steps

# ──────────────────────────────────────────────────────────────────────────────
# Debug
# Options for debugging training runs.
debug:
  # Enable debug mode. This will activate additional checks and logging,
  # which may impact performance.
  enabled: false

  # If true, dump the input tensors and model outputs to a .pt file
  # when a non-finite value is detected in the model's output logits.
  # This is useful for offline analysis of the exact data causing the issue.
  dump_tensors_on_error: false

  # If true, log detailed information about the batch that caused a
  # non-finite error. This includes file paths or other identifiers from the
  # dataloader, which can help in reproducing the error.
  log_batch_info_on_error: false

  # Enable PyTorch's anomaly detection for debugging gradients.
  # This will slow down training significantly.
  detect_anomaly: false

  # If true, log the gradient norm of the model's parameters to TensorBoard.
  # This is useful for monitoring training stability.
  log_gradient_norm: true

  # If true, perform a pre-training validation step to check the integrity
  # of the input data. This can help catch issues early.
  validate_input_data: false

  # If true, log statistics (min/mean/max) of input batches.
  log_input_stats: false

  # If true, log statistics (min/mean/max) of model activations such as logits.
  log_activation_stats: true
